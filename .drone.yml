kind: pipeline
type: docker
name: default

steps:
  - name: Build
    image: node:20
    commands:
      - npm ci
      - npm run build
      - npm run build:server
      - mkdir -p deploy
      - cp -rv .next deploy/
      - cp -rv public deploy/
      - cp -rv dist deploy/
      - cp package.json deploy/
      - cp package-lock.json deploy/
      - cp next.config.ts deploy/
      - cd deploy && npm ci --omit=dev

  - name: Deploy
    image: docker:27-cli
    environment:
      ADMIN_PASSWORD:
        from_secret: admin_password
      SESSION_SECRET:
        from_secret: session_secret
      DISCORD_CLIENT_ID:
        from_secret: discord_client_id
      DISCORD_CLIENT_SECRET:
        from_secret: discord_client_secret
      DISCORD_BOT_TOKEN:
        from_secret: discord_bot_token
    commands:
      - docker ps
      - docker volume create duemmer_geht_immer
      - docker volume create duemmer_geht_immer_data
      - docker run --rm -v duemmer_geht_immer:/target alpine sh -c "rm -rf /target/*"
      - tar -C deploy -cf - . | docker run --rm -i -v duemmer_geht_immer:/target alpine sh -c "tar -C /target -xf -"
      - docker stop duemmer_geht_immer || true
      - docker rm duemmer_geht_immer || true
      - |
        docker run -d \
          --name duemmer_geht_immer \
          --restart always \
          -p 780:3000 \
          -p 7553:3000 \
          -e NODE_ENV=production \
          -e DATA_DIR=/data \
          -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
          -e SESSION_SECRET="$SESSION_SECRET" \
          -e DISCORD_CLIENT_ID="$DISCORD_CLIENT_ID" \
          -e DISCORD_CLIENT_SECRET="$DISCORD_CLIENT_SECRET" \
          -e DISCORD_BOT_TOKEN="$DISCORD_BOT_TOKEN" \
          -e DISCORD_GUILD_ID=1355322631641104385 \
          -e DISCORD_EXTRA_GUILD_IDS=801069007997370378 \
          -e PUBLIC_URL=https://quiz.notjan.de \
          -e BOT_WINNER=off \
          -v duemmer_geht_immer:/app \
          -v duemmer_geht_immer_data:/data \
          -w /app \
          node:20-alpine node dist/server.js
